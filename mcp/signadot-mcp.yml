  - name: list_sandboxes
    description: List sandboxes in the organization.
    source_operation: openapi/signadot-openapi-original.yml#list-sandboxes
  - name: get_sandbox
    description: Retrieve a sandbox including status and preview endpoints.
    source_operation: openapi/signadot-openapi-original.yml#get-sandbox
  - name: create_routegroup
    description: Create or update a route group spanning multiple sandboxes.
    source_operation: openapi/signadot-openapi-original.yml#apply-routegroup
  - name: list_routegroups
    description: List route groups in the organization.
    source_operation: openapi/signadot-openapi-original.yml#list-routegroups
  - name: list_clusters
    description: List connected Kubernetes clusters.
    source_operation: openapi/signadot-openapi-original.yml#list-clusters
  - name: list_resource_plugins
    description: List available resource plugins.
    source_operation: openapi/signadot-openapi-original.yml#list-resource-plugins
