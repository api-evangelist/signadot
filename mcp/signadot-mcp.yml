description: >-
  Signadot's Model Context Protocol server, bundled with the Signadot CLI. Exposes control-plane
  operations as MCP tools so MCP-compatible coding agents (Cursor, Claude Code, VS Code, Codex)
  can create sandboxes and route groups and run validations against real Kubernetes dependencies.
tools:
