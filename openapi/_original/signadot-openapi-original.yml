basePath: /api/v2
definitions:
  Cluster:
    properties:
      clusterConfig:
        allOf:
          - $ref: '#/definitions/config.ClusterConfig'
        description: Cluster config read from the cluster
      createdAt:
        description: The time when this cluster was registered with Signadot.
        type: string
      name:
        description: The name of the cluster.
        type: string
      operator:
        allOf:
          - $ref: '#/definitions/cluster.Operator'
        description: Information about the Signadot Operator in this cluster.
    type: object
  ClusterToken:
    properties:
      createdAt:
        description: The time when this cluster was registered with Signadot.
        type: string
      id:
        description: The ID of this token
        type: string
      maskedValue:
        description: A Masked token value.
        type: string
      status:
        allOf:
          - $ref: '#/definitions/ClusterTokenStatus'
        description: Token status.
      token:
        description: The token value.
        type: string
    type: object
  ClusterTokenStatus:
    properties:
      lastConnectedAt:
        description: The last time at which this token was used to connect.
        type: string
      lastConnectedIp:
        description: The last IP address from which this token connected.
        type: string
    type: object
  EmptyResponse:
    type: object
  ErrorResponse:
    properties:
      code:
        type: integer
      error:
        type: string
      requestId:
        type: string
    type: object
  ResourceInfo:
    properties:
      cluster:
        description: Cluster that the resource is created in
        type: string
      name:
        description: Name of the created resource
        type: string
      sandbox:
        description: Name of the sandbox containing the resource
        type: string
    type: object
  ResourcePlugin:
    properties:
      createdAt:
        description: The time at which the resource plugin was created
        type: string
      name:
        description: |-
          Plugin identity of the form `bareName[@semver]`. The bare-name
          form (no `@`) means the default version (0.0.0); responses
          for plugins at the default version use this bare form for
          backward compatibility with pre-versioning clients.
        example: my-plugin@1.2.0
        type: string
      spec:
        allOf:
          - $ref: '#/definitions/resourceplugin.Spec'
        description: Specification for the resource plugin
      status:
        allOf:
          - $ref: '#/definitions/resourceplugin.Status'
        description: Status of the resource plugin
      updatedAt:
        description: The time at which the resource plugin was last updated
        type: string
    type: object
  RouteGroup:
    properties:
      createdAt:
        type: string
      defaults:
        $ref: '#/definitions/defaults.CompositeDefaults'
      endpoints:
        items:
          $ref: '#/definitions/routegroups.EndpointURL'
        type: array
        x-omitempty: true
      name:
        type: string
      routingKey:
        type: string
      spec:
        $ref: '#/definitions/routeGroup.Spec'
      status:
        $ref: '#/definitions/routeGroup.Status'
      updatedAt:
        type: string
    type: object
  Sandbox:
    properties:
      createdAt:
        type: string
      defaults:
        $ref: '#/definitions/defaults.CompositeDefaults'
      endpoints:
        items:
          $ref: '#/definitions/sandbox.Endpoint'
        type: array
      name:
        description: Human-readable name of this sandbox
        type: string
      routingKey:
        type: string
      spec:
        $ref: '#/definitions/sandbox.Spec'
      status:
        allOf:
          - $ref: '#/definitions/sandbox.Readiness'
        description: Status *sdv1.SandboxReadiness `json:"status,omitempty"`
      updatedAt:
        type: string
    type: object
  authtypes.UserFlags:
    additionalProperties:
      type: boolean
    type: object
  cluster.Operator:
    properties:
      version:
        description: |-
          The operator version of the cluster.  This may be
          nil if the cluster has not yet connected to Signadot.
        type: string
    type: object
  config.ClusterConfig:
    properties:
      allowOrphanedResources:
        type: boolean
      allowedNamespaces:
        items:
          type: string
        type: array
      controlPlane:
        $ref: '#/definitions/config.ControlPlaneConfig'
      routing:
        $ref: '#/definitions/config.RoutingConfig'
      sandboxTrafficManager:
        allOf:
          - $ref: '#/definitions/config.SandboxTrafficManagerConfig'
        description: Deprecated field
      trafficCapture:
        $ref: '#/definitions/config.TrafficCaptureConfig'
      trafficManager:
        $ref: '#/definitions/config.TrafficManagerConfig'
    type: object
  config.ControlPlaneConfig:
    properties:
      disabled:
        description: control plane can be disabled
        type: boolean
      proxy:
        description: control plane proxy can be "enabled" or "disabled"
        type: string
      tunnelAddr:
        type: string
      tunnelTLS:
        type: boolean
    type: object
  config.DefaultHeaderClass:
    enum:
      - baggage
      - tracestate
    type: string
    x-enum-varnames:
      - DefaultHeaderBaggage
      - DefaultHeaderTraceState
  config.GatewayAPIConfig:
    properties:
      enabled:
        type: boolean
      preservedAnnotations:
        items:
          type: string
        type: array
      preservedLabels:
        items:
          type: string
        type: array
    type: object
  config.IstioConfig:
    properties:
      enableHostRouting:
        description: Deprecated fields
        type: boolean
      enabled:
        type: boolean
      operator:
        $ref: '#/definitions/config.IstioSignadotOperator'
    type: object
  config.IstioSignadotOperator:
    properties:
      podLabels:
        additionalProperties:
          type: string
        type: object
    type: object
  config.LinkerdConfig:
    properties:
      enabled:
        type: boolean
      operator:
        $ref: '#/definitions/config.LinkerdSignadotOperator'
    type: object
  config.LinkerdSignadotOperator:
    properties:
      podAnnotations:
        additionalProperties:
          type: string
        type: object
    type: object
  config.QueryParamRoutingConfig:
    properties:
      enabled:
        type: boolean
      paramName:
        type: string
    type: object
  config.RoutingConfig:
    properties:
      customHeaders:
        items:
          type: string
        type: array
      defaultHeaders:
        items:
          $ref: '#/definitions/config.DefaultHeaderClass'
        type: array
      gatewayAPI:
        $ref: '#/definitions/config.GatewayAPIConfig'
      iptablesMode:
        type: string
      istio:
        $ref: '#/definitions/config.IstioConfig'
      linkerd:
        $ref: '#/definitions/config.LinkerdConfig'
      queryParamRouting:
        $ref: '#/definitions/config.QueryParamRoutingConfig'
    type: object
  config.SandboxTrafficManagerConfig:
    properties:
      enabled:
        type: boolean
    type: object
  config.TrafficCaptureConfig:
    properties:
      enabled:
        type: boolean
      requestHeadersElide:
        items:
          type: string
        type: array
      responseHeadersElide:
        items:
          type: string
        type: array
    type: object
  config.TrafficManagerConfig:
    properties:
      enabled:
        type: boolean
    type: object
  defaults.CompositeDefaults:
    properties:
      cluster:
        items:
          $ref: '#/definitions/defaults.Default'
        type: array
    type: object
  defaults.Default:
    properties:
      class:
        $ref: '#/definitions/defaults.DefaultClass'
      createdAt:
        type: string
      resourceKind:
        $ref: '#/definitions/defaults.ResourceKind'
      updatedAt:
        type: string
      value: {}
    type: object
  defaults.DefaultClass:
    enum:
      - ttl
    type: string
    x-enum-varnames:
      - TTL
  defaults.ResourceKind:
    enum:
      - sandbox
      - routegroup
    type: string
    x-enum-varnames:
      - SandboxResourceKind
      - RouteGroupResourceKind
  endpoints.Endpoint:
    properties:
      name:
        type: string
      target:
        type: string
    type: object
  jobs.Phase:
    enum:
      - queued
      - running
      - failed
      - succeeded
      - canceled
    type: string
    x-enum-varnames:
      - QueuedPhase
      - RunningPhase
      - FailedPhase
      - SucceededPhase
      - CanceledPhase
  jobs.PhaseCount:
    properties:
      count:
        type: integer
      phase:
        $ref: '#/definitions/jobs.Phase'
    type: object
  local.From:
    properties:
      kind:
        description: Kind of the baseline workload.
        example: Deployment
        type: string
      name:
        description: Name of the entity within the Kubernetes cluster.
        example: my-frontend
        type: string
      namespace:
        description: Namespace within which the entity lives in the Kubernetes cluster.
        example: default
        type: string
    required:
      - kind
      - name
      - namespace
    type: object
  orgs.GetOrgNameResponse:
    properties:
      clusterID:
        description: >-
          ID of Authenticated Cluster, if any (via signadot-cluster-token
          header)
        type: string
      featureFlags:
        additionalProperties:
          type: boolean
        description: Feature Flags as result of authentication
        type: object
      orgs:
        items:
          $ref: '#/definitions/orgs.Org'
        type: array
      user:
        allOf:
          - $ref: '#/definitions/orgs.User'
        description: Authenticated User, if any
      userFlags:
        allOf:
          - $ref: '#/definitions/authtypes.UserFlags'
        description: Flags of authenticated user, if any
    type: object
  orgs.Org:
    properties:
      displayName:
        type: string
      name:
        type: string
    type: object
  orgs.User:
    properties:
      avatar:
        type: string
      createdAt:
        type: string
      email:
        type: string
      firstName:
        type: string
      id:
        type: string
      lastName:
        type: string
      role:
        type: string
      updatedAt:
        type: string
    type: object
  resourceplugin.Runner:
    properties:
      image:
        description: Image for the runner instance
        type: string
      namespace:
        description: Namespace to create this runner instance in
        type: string
      podTemplateOverlay:
        description: Pod template overlay
        type: string
    type: object
  resourceplugin.Spec:
    properties:
      create:
        description: Create refers to the `create` steps for spinning up the resource
        items:
          $ref: '#/definitions/resourceplugin.Step'
        type: array
      delete:
        description: Delete refers to the `delete` steps for spinning up the resource
        items:
          $ref: '#/definitions/resourceplugin.Step'
        type: array
      description:
        description: Description for the resource
        type: string
      runner:
        allOf:
          - $ref: '#/definitions/resourceplugin.Runner'
        description: Runner for the resource plugin
    type: object
  resourceplugin.Status:
    properties:
      resources:
        description: Resources created using the resource plugin
        items:
          $ref: '#/definitions/ResourceInfo'
        type: array
    type: object
  resourceplugin.Step:
    properties:
      inputs:
        description: Inputs for the step
        items:
          $ref: '#/definitions/resourceplugin.StepInput'
        type: array
      name:
        description: Name for the step
        type: string
      outputs:
        description: Outputs for the step
        items:
          $ref: '#/definitions/resourceplugin.StepOut'
        type: array
      script:
        description: Script to execute in the step
        type: string
    type: object
  resourceplugin.StepInput:
    properties:
      as:
        allOf:
          - $ref: '#/definitions/resourceplugin.StepInputTo'
        description: |-
          If the As field is not speficied, we will take the input name
          uppercase it, convert "-" to "_", and inject it as an env var into
          the main container
      name:
        description: Name for the input
        type: string
      type:
        description: Type of input
        type: string
      valueFromSandbox:
        description: >-
          ValueFromSandbox defines whether or not to source value from the
          sandbox spec
        type: boolean
      valueFromStep:
        allOf:
          - $ref: '#/definitions/resourceplugin.ValueFromStep'
        description: |-
          ValueFromStep is an optional string specifying the output of
          another step when not nil.  Exactly one of ValueFromSandbox
          and 'ValueFromStep != nil' must hold.
    type: object
  resourceplugin.StepInputTo:
    properties:
      env:
        description: |-
          Inject the input as an env variable with name Env inside the
          main container
        type: string
      path:
        description: Expose the input as a file at Path inside the main container
        type: string
    type: object
  resourceplugin.StepOut:
    properties:
      description:
        description: Description for the output
        type: string
      name:
        description: Name of the output variable
        type: string
      type:
        description: Type of output
        type: string
      valueFromPath:
        description: Path within the main container from where the output will be read
        type: string
    type: object
  resourceplugin.ValueFromStep:
    properties:
      name:
        description: Name of the step
        type: string
      output:
        description: Name of the variable from the step
        type: string
    type: object
  routeGroup.Match:
    properties:
      all:
        description: >-
          When All is non-nil, T matches a set of labels if and only if every
          element of All matches them.

          Only one field may be non-nil.
        items:
          $ref: '#/definitions/routeGroup.Match'
        type: array
        x-omitempty: true
      any:
        description: >-
          When Any is non-nil, T matches a set of labels if and only if some
          element of Any matches them.

          Only one field may be non-nil.
        items:
          $ref: '#/definitions/routeGroup.Match'
        type: array
        x-omitempty: true
      label:
        allOf:
          - $ref: '#/definitions/routeGroup.MatchLabel'
        description: >-
          When Label is non-nil, T matches a set of labels L if and only if
          t.Label.Matches(L).

          Only one field may be non-nil.
    type: object
  routeGroup.MatchLabel:
    properties:
      key:
        description: |-
          Key is an exact match on a label key, glob
          characters are just considered normal characters.
        type: string
      value:
        description: |-
          Value is a glob match for the value of a
          sandbox label.  See https://pkg.go.dev/path/filepath#Match
          for the file glob syntax.
        type: string
    type: object
  routeGroup.Spec:
    properties:
      cluster:
        description: |-
          Cluster gives the cluster to which the route group applies.
          If left empty, this RG will become a multi-cluster RG..
        type: string
      description:
        description: Description provides a short description of the route group.
        type: string
      endpoints:
        description: |-
          Endpoints define endpoints which target different in-cluster
          services.
        items:
          $ref: '#/definitions/routegroups.Endpoint'
        type: array
      match:
        allOf:
          - $ref: '#/definitions/routeGroup.Match'
        description: |-
          Match defines a matcher for labels, which matches
          sandboxes that should be a part of this route group.
      ttl:
        allOf:
          - $ref: '#/definitions/routeGroup.TTL'
        description: TTL define when/how the route group should be deleted
    type: object
  routeGroup.Status:
    properties:
      matchedSandboxes:
        description: |-
          MatchedSandboxes gives the list of sandboxes whose labels
          were matched by the 'match' object in the spec.
        items:
          type: string
        type: array
      message:
        description: |-
          Message is a human readable explanation of why
          the sandbox is healthy or not.
        type: string
      ready:
        description: |-
          Ready indicates whether the sandbox is ready,
          meaning that it can be used for testing.
        type: boolean
      reason:
        description: |-
          Reason is a machine readable explanation of why
          the sandbox is healthy or not.
        type: string
      scheduledDeleteTime:
        description: >-
          ScheduledDeleteTime returns the formatted and computed ttl based on
          the Duration

          and OffsetFrom
        type: string
    type: object
  routeGroup.TTL:
    properties:
      duration:
        description: |-
          Duration represents the duration until routegroup's end of life.
          It should be an unsigned integer not exceeding 32 bits followed by
          a units character, which can be one of the following.
            - 'm' for minutes
            - 'h' for hours
            - 'd' for days
            - 'w' for weeks
        type: string
      offsetFrom:
        description: >-
          OffsetFrom indicates what the Duration is relative to.  It

          may be the empty string, "noMatchedSandboxes", "createdAt" or
          "updatedAt". The empty string

          defaults to meaning "noMatchedSandboxes".
        type: string
    type: object
  routegroups.Endpoint:
    properties:
      cluster:
        type: string
      name:
        type: string
      target:
        type: string
    type: object
  routegroups.EndpointURL:
    properties:
      cluster:
        type: string
      name:
        type: string
      target:
        type: string
      url:
        type: string
    type: object
  sandbox.CustomPatch:
    properties:
      type:
        $ref: '#/definitions/sandboxes.PatchType'
      value:
        type: string
    type: object
  sandbox.Customizations:
    properties:
      env:
        description: >-
          Environment variable modifications that will be applied to the forked
          workload
        items:
          $ref: '#/definitions/sandbox.EnvVar'
        type: array
      images:
        description: One or more docker images that will be applied to the forked workload
        items:
          $ref: '#/definitions/sandbox.Image'
        type: array
      patch:
        $ref: '#/definitions/sandbox.CustomPatch'
    type: object
  sandbox.DefaultRouteGroup:
    properties:
      endpoints:
        items:
          $ref: '#/definitions/endpoints.Endpoint'
        type: array
    type: object
  sandbox.Endpoint:
    properties:
      baselineUrl:
        type: string
      host:
        type: string
      name:
        type: string
      port:
        type: integer
      protocol:
        type: string
      routeType:
        type: string
      target:
        type: string
      url:
        type: string
    type: object
  sandbox.EnvValueFrom:
    properties:
      configMap:
        $ref: '#/definitions/sandbox.EnvValueFromMap'
      fork:
        $ref: '#/definitions/sandbox.EnvValueFromFork'
      resource:
        $ref: '#/definitions/sandbox.EnvValueFromResource'
      secret:
        $ref: '#/definitions/sandbox.EnvValueFromMap'
    type: object
  sandbox.EnvValueFromFork:
    properties:
      expression:
        type: string
      forkOf:
        $ref: '#/definitions/sandbox.ForkOf'
    type: object
  sandbox.EnvValueFromMap:
    properties:
      key:
        type: string
      name:
        type: string
      optional:
        type: boolean
    type: object
  sandbox.EnvValueFromResource:
    properties:
      name:
        type: string
      outputKey:
        type: string
    type: object
  sandbox.EnvVar:
    properties:
      container:
        description: name of container to which it applies
        type: string
      name:
        description: environmental variable name
        type: string
      operation:
        allOf:
          - $ref: '#/definitions/sandboxes.EnvOpName'
        description: upsert or delete
      value:
        description: environmental variable value
        type: string
      valueFrom:
        allOf:
          - $ref: '#/definitions/sandbox.EnvValueFrom'
        description: environmental variable dynamic value
    type: object
  sandbox.Fork:
    properties:
      customizations:
        allOf:
          - $ref: '#/definitions/sandbox.Customizations'
        description: Customizations specify the customizations we will apply on the fork
      endpoints:
        description: Deprecated. Use defaultRouteGroup.Endpoints instead.
        items:
          $ref: '#/definitions/sandbox.ForkEndpoint'
        type: array
        x-omitempty: 'true'
      forkOf:
        allOf:
          - $ref: '#/definitions/sandbox.ForkOf'
        description: >-
          ForkOf specifies the target workload that we will be forking.  In this
          usage

          the Kind of the ForkOf object must not be a service.
      name:
        type: string
    type: object
  sandbox.ForkEndpoint:
    properties:
      name:
        description: Name of the endpoint
        type: string
      port:
        description: Port it will map to on the forked workload
        type: integer
      protocol:
        description: Protocol that this endpoint uses
        type: string
    type: object
  sandbox.ForkOf:
    properties:
      kind:
        description: Kind of the baseline workload.
        example: Deployment
        type: string
      name:
        description: Name of the entity within the Kubernetes cluster.
        example: my-frontend
        type: string
      namespace:
        description: Namespace within which the entity lives in the Kubernetes cluster.
        example: default
        type: string
    required:
      - kind
      - name
      - namespace
    type: object
  sandbox.HostEndpoint:
    properties:
      host:
        description: Hostname that this endpoint points to
        type: string
      name:
        description: Name of the endpoint
        type: string
      port:
        description: Port it will map to on the specified host
        type: integer
      protocol:
        description: Protocol that this endpoint uses
        type: string
    type: object
  sandbox.Image:
    properties:
      container:
        description: >-
          Container is the container this image must apply to in the forked
          workload
        type: string
      image:
        description: Name of the image (e.g. gcr.io/my-image/repo:my-tag)
        type: string
    type: object
  sandbox.Readiness:
    properties:
      forwards:
        description: Forwards status
        items:
          $ref: '#/definitions/sandboxes.ForwardStatus'
        type: array
      jobs:
        allOf:
          - $ref: '#/definitions/sandboxes.JobsSummary'
        description: status of the jobs running in the context of the given sandbox
      message:
        description: |-
          Message is a human readable explanation of why
          the sandbox is healthy or not.
        type: string
      ready:
        description: |-
          Ready indicates whether the sandbox is ready,
          meaning that it can be used for testing.
        type: boolean
      reason:
        description: |-
          Reason is a machine readable explanation of why
          the sandbox is healthy or not.
        type: string
      scheduledDeleteTime:
        description: >-
          ScheduledDeleteTime returns the formatted and computed ttl based on
          the Duration

          and OffsetFrom
        type: string
      testExecutions:
        allOf:
          - $ref: '#/definitions/sandbox.TestExecutionsSummary'
        description: >-
          status of the test executions running in the context of the given
          sandbox
    type: object
  sandbox.Resource:
    properties:
      name:
        description: >-
          Unique name for this resource (used to reference it in env vars and
          files)
        type: string
      params:
        additionalProperties:
          type: string
        description: Plugin-specific parameters as key-value pairs
        type: object
      plugin:
        description: Plugin name, optionally suffixed with @version (e.g. my-plugin@1.2.0)
        type: string
    type: object
  sandbox.Spec:
    properties:
      cluster:
        description: Cluster within which this sandbox should be created
        type: string
      defaultRouteGroup:
        allOf:
          - $ref: '#/definitions/sandbox.DefaultRouteGroup'
        description: >-
          DefaultRouteGroup can be used to define route group endpoints for the
          sandbox.
      description:
        description: Description of the purpose of this sandbox
        type: string
      disableSandboxTrafficManager:
        description: >-
          DisableSandboxTrafficManager provides a way of turning off the sandbox

          traffic manager for forks in this sandbox.

          Deprecated in operators since v1.1. The sandbox traffic manager has
          been

          retired.
        type: boolean
      endpoints:
        description: Deprecated. Use defaultRouteGroup.Endpoints instead.
        items:
          $ref: '#/definitions/sandbox.HostEndpoint'
        type: array
        x-omitempty: 'true'
      forks:
        description: Forks is the specification of each forked entity
        items:
          $ref: '#/definitions/sandbox.Fork'
        type: array
      labels:
        additionalProperties:
          type: string
        description: >-
          Labels are used to specify metadata associated with the sandbox as
          key-value pairs.
        type: object
      middleware:
        description: Request Middleware
        items:
          $ref: '#/definitions/sandboxes.Middleware'
        type: array
      resources:
        description: Resources specifies each required resource to spin up the sandbox
        items:
          $ref: '#/definitions/sandbox.Resource'
        type: array
      routing:
        allOf:
          - $ref: '#/definitions/sandboxes.Routing'
        description: Routing specification
      ttl:
        allOf:
          - $ref: '#/definitions/sandbox.TTL'
        description: |-
          TTL gives the maximum lifetime of the sandbox.
          It may be empty, in which case it defaults to forever.
      virtual:
        description: Virtual Workloads
        items:
          $ref: '#/definitions/virtual'
        type: array
    required:
      - cluster
      - forks
    type: object
  sandbox.TTL:
    properties:
      duration:
        description: |-
          Duration represents the duration until sandbox end of life.
          It should be an unsigned integer not exceeding 32 bits followed by
          a units character, which can be one of the following.
            - 'm' for minutes
            - 'h' for hours
            - 'd' for days
            - 'w' for weeks
        type: string
      offsetFrom:
        description: |-
          OffsetFrom indicates what the Duration is relative to.  It
          may be the empty string, "createdAt" or "updatedAt".  The empty string
