        type: string
    type: object
  sandboxes.Argument:
    properties:
      name:
        description: Name indicates the name of the associated parameter.
        type: string
      value:
        description: |-
          Value indicates the value passed to the parameter of
          the same name.
        type: string
      valueFrom:
        allOf:
          - $ref: '#/definitions/sandboxes.ArgValueFrom'
        description: ValueFrom indicates from where to grab the value
    type: object
  sandboxes.EnvOpName:
    enum:
