      summary: Delete a resource plugin
      tags:
        - ResourcePlugins
    get:
      consumes:
        - application/json
      description: >-
        Get the specified resource plugin. Omit the version query parameter to
        get the latest version.
      operationId: get-resource-plugin
      parameters:
        - description: Signadot Org Name
          in: path
          name: orgName
          required: true
          type: string
          x-example: my-company
        - description: Resource plugin name
          in: path
          name: pluginName
          required: true
          type: string
          x-example: mariadb-plugin
        - description: Resource plugin version (semver); omit for latest
          in: query
          name: version
          type: string
          x-example: 1.2.0
      produces:
        - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/ResourcePlugin'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        '502':
          description: Bad Gateway
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
        - ApiKeyAuth: []
      summary: Get the requested resource plugin
      tags:
        - ResourcePlugins
    put:
      consumes:
        - application/json
      description: >-
        Creates a new version of a resource plugin. The body's `name` field
        carries the wire form `bareName[@semver]` (e.g. `my-plugin@1.2.0`); its
        bare part must match the URL path name. A bare-name form (no `@`)
        publishes the default version `0.0.0`. Versions are immutable; PUTting
        an existing (name, version) pair returns 409. The version suffix must be
        a concrete semver; "latest" is only accepted on the read and delete
        query parameters.
      operationId: apply-resource-plugin
      parameters:
        - description: Signadot Org Name
          in: path
          name: orgName
          required: true
          type: string
          x-example: my-company
        - description: Resource plugin name
          in: path
          name: pluginName
          required: true
          type: string
          x-example: mariadb-plugin
        - description: Request to create a resource plugin version
          in: body
          name: data
          required: true
          schema:
            $ref: '#/definitions/ResourcePlugin'
      produces:
        - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/EmptyResponse'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        '409':
          description: Conflict
          schema:
            $ref: '#/definitions/ErrorResponse'
        '502':
          description: Bad Gateway
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
        - ApiKeyAuth: []
      summary: Apply a resource plugin
      tags:
        - ResourcePlugins
