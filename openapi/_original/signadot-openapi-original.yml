      - merge
      - json
      - signadot/env
      - signadot/image
    type: string
    x-enum-varnames:
      - PatchTypeStrategic
      - PatchTypeMerge
      - PatchTypeJSON
      - PatchTypeSDEnv
      - PatchTypeSDImage
  sandboxes.Routing:
    properties:
