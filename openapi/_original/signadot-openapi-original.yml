  /orgs/{orgName}/resource-plugins:
    get:
      consumes:
        - application/json
      description: >-
        List resource plugins under the specified Signadot org. By default
        returns only the highest-semver version of each plugin. Pass
        `?version=all` to expand the response into one row per published (name,
        version), sorted by name then semver-descending. `?version=latest` is
        accepted as an explicit alias for the default.
      operationId: list-resource-plugins
      parameters:
        - description: Signadot Org Name
          in: path
          name: orgName
          required: true
          type: string
          x-example: my-company
        - description: >-
            'latest' (default) returns only the highest-semver version of each
            plugin; 'all' returns every published version
          enum:
            - latest
            - all
          in: query
          name: version
          type: string
      produces:
        - application/json
      responses:
        '200':
          description: OK
          schema:
            items:
              $ref: '#/definitions/ResourcePlugin'
            type: array
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        '502':
          description: Bad Gateway
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
        - ApiKeyAuth: []
      summary: List resource plugins
      tags:
        - ResourcePlugins
  /orgs/{orgName}/resource-plugins/{pluginName}:
    delete:
      consumes:
        - application/json
      description: >-
        Delete a resource plugin version. Omit the version query parameter to
        delete the latest version. Deletion is blocked when any sandbox
        references the specific version being deleted.
      operationId: delete-resource-plugin
      parameters:
        - description: Signadot Org Name
          in: path
          name: orgName
          required: true
          type: string
          x-example: my-company
        - description: Resource plugin name
          in: path
          name: pluginName
          required: true
          type: string
          x-example: mariadb-plugin
        - description: Resource plugin version (semver); omit for latest
          in: query
          name: version
          type: string
          x-example: 1.2.0
      produces:
        - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/EmptyResponse'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        '502':
